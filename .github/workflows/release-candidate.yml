name: Release candidate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned development-only wheel builder
        run: python -m pip install --disable-pip-version-check setuptools==84.0.0 wheel==0.46.3
      - name: Run regression tests and prepare the reviewed bundle
        run: |
          python -m unittest discover -v
          python tools/build_release.py --require-public-license
      - name: Independently verify the downloaded-asset contract
        run: python tools/verify_release.py out/release-candidate
      - name: Retain the verified licensed candidate without publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: payment-control-lab-release-candidate-${{ github.sha }}
          path: out/release-candidate/
          if-no-files-found: error
          retention-days: 7
